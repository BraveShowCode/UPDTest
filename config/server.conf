# UDP multicast discovery server configuration
multicast_group = 239.255.0.1
multicast_port = 30001
bind_address = 0.0.0.0
interface = 0.0.0.0
poll_timeout_ms = 1000

# ZeroMQ configuration returned to clients over UDP unicast
zeromq_endpoint = tcp://10.0.0.10:5555
zeromq_pub_endpoint = tcp://10.0.0.10:5556
zeromq_sub_endpoint = tcp://10.0.0.10:5557
zeromq_topic = market-data
